# TakeoutSystem 外卖系统 API 测试数据

# ============================================================
# 认证模块测试数据
# ============================================================
auth:
  valid_accounts:
    - phone: "13800000003"
      code: "123456"
      role: "CUSTOMER"
      desc: "普通用户"
    - phone: "13800000002"
      code: "123456"
      role: "MERCHANT"
      desc: "商家1-辣味馆"
    - phone: "13800000004"
      code: "123456"
      role: "MERCHANT"
      desc: "商家2-快乐汉堡"
    - phone: "13800000001"
      code: "123456"
      role: "ADMIN"
      desc: "管理员"
  invalid_accounts:
    - phone: "13800000099"
      code: "123456"
      expected_status: 400
      desc: "不存在的手机号"
    - phone: "13800000003"
      code: "000000"
      expected_status: 400
      desc: "错误验证码"
    - phone: ""
      code: "123456"
      expected_status: 400
      desc: "空手机号"
    - phone: "1380000"
      code: "123456"
      expected_status: 400
      desc: "格式错误的手机号"

# ============================================================
# 商家模块测试数据
# ============================================================
merchant:
  valid_ids:
    - id: 1
      name: "辣味馆"
      desc: "商家1"
    - id: 2
      name: "快乐汉堡"
      desc: "商家2"
  search_cases:
    - keyword: "辣"
      expected_min: 1
      desc: "有结果搜索"
    - keyword: "汉堡"
      expected_min: 1
      desc: "有结果搜索"
    - keyword: "不存在xyz123"
      expected: 0
      desc: "无结果搜索"
  nearby_cases:
    - lat: 31.23
      lng: 121.47
      radius: 10000
      desc: "上海市中心附近商家"

# ============================================================
# 商品模块测试数据
# ============================================================
product:
  merchant_menu:
    - merchant_id: 1
      expect_has_categories: true
      desc: "辣味馆菜单"
    - merchant_id: 2
      expect_has_categories: true
      desc: "快乐汉堡菜单"
  new_dish:
    - name: "测试菜品"
      price: 19.9
      category_id: 1
      expected_status: 200
      desc: "正常添加"
    - name: ""
      price: 19.9
      category_id: 1
      expected_status: 400
      desc: "菜名为空"
    - name: "测试"
      price: -1
      category_id: 1
      expected_status: 400
      desc: "价格为负"

# ============================================================
# 购物车模块测试数据
# ============================================================
cart:
  add_items:
    - merchant_id: 1
      dish_id: 1
      quantity: 2
      desc: "正常加购"
    - merchant_id: 1
      dish_id: 1
      quantity: 0
      expected_status: 400
      desc: "数量为0"
    - merchant_id: 1
      dish_id: 9999
      quantity: 1
      expected_status: 400
      desc: "不存在的菜品"

# ============================================================
# 订单模块测试数据
# ============================================================
order:
  statuses:
    pending_payment: 1
    awaiting_merchant: 2
    preparing: 3
    ready: 4
    delivering: 5
    delivered: 6
    completed: 7
    cancelled: 8
    refunding: 9
  submit:
    - merchant_id: 1
      address_id: 1
      desc: "正常下单"
      expected: 200
  cancel_reason: "测试取消订单"

# ============================================================
# 支付模块测试数据
# ============================================================
payment:
  methods:
    - "mock"
    - "wechat"
    - "alipay"

# ============================================================
# 评价模块测试数据
# ============================================================
review:
  valid_rating:
    - rating: 5
      content: "很好吃！"
      desc: "好评"
    - rating: 1
      content: "不好吃"
      desc: "差评"
  invalid_rating:
    - rating: 0
      expected_status: 400
      desc: "低于最小值"
    - rating: 6
      expected_status: 400
      desc: "超过最大值"

# ============================================================
# 优惠券模块测试数据
# ============================================================
coupon:
  test_coupon_id: 1

# ============================================================
# 收藏模块测试数据
# ============================================================
favorite:
  test_merchant_ids:
    - 1
    - 2

# ============================================================
# 边界值测试数据
# ============================================================
boundary:
  phone:
    - value: "13800000003"
      valid: true
      desc: "正常11位手机号"
    - value: "1"
      valid: false
      desc: "1位"
    - value: "138000000031234567"
      valid: false
      desc: "超长18位"
    - value: ""
      valid: false
      desc: "空字符串"
  rating:
    - value: 1
      valid: true
      desc: "最低1"
    - value: 5
      valid: true
      desc: "最高5"
    - value: 0
      valid: false
      desc: "低于最小值"
    - value: 6
      valid: false
      desc: "超过最大值"
  quantity:
    - value: 1
      valid: true
      desc: "最小1"
    - value: 99
      valid: true
      desc: "正常99"
    - value: 0
      valid: false
      desc: "零数量"
    - value: -1
      valid: false
      desc: "负数"

# ============================================================
# 安全测试数据
# ============================================================
security:
  sql_injection:
    - payload: "' OR '1'='1"
      desc: "SQL注入-恒真条件"
    - payload: "'; DROP TABLE orders; --"
      desc: "SQL注入-删除表"
    - payload: "' UNION SELECT * FROM users; --"
      desc: "SQL注入-联合查询"
  xss:
    - payload: "<script>alert('XSS')</script>"
      desc: "XSS脚本注入"
    - payload: "<img src=x onerror=alert(1)>"
      desc: "XSS图片错误"
    - payload: "javascript:alert('XSS')"
      desc: "XSS伪协议"
  long_input:
    - field: "remark"
      length: 300
      desc: "300字备注"
    - field: "content"
      length: 1000
      desc: "1000字评价"
