[pytest]
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

addopts = -v --tb=short --disable-warnings

markers =
    api: API 自动化测试
    ui: UI 自动化测试（需要浏览器）
    smoke: 冒烟测试 - 核心流程快速验证
    regression: 回归测试
    critical: 关键业务路径（下单、登录等）
    boundary: 边界值测试（空值、极值、特殊字符）
    security: 安全测试（SQL注入、XSS、超长输入）
    performance: 性能测试（响应时间验证）
    integration: 端对端集成测试（需服务运行）
    h5: H5 用户端 UI 测试
    merchant: 商家端相关测试
    admin: 管理后台测试
    auth: 认证模块测试
    order: 订单模块测试
    payment: 支付模块测试
    mock: Mock 模式相关测试

filterwarnings =
    ignore::DeprecationWarning
